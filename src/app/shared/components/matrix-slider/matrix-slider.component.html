<div class="matrix-slider">
  <div class="slider-content">
    <div class="morpheus-stage">
      <img src="assets/img/Matrix-y-morfeo-removebg-preview.png" alt="Morpheus ofreciendo la píldora roja y la píldora azul">
      <button
        type="button"
        class="pill pill-red"
        (click)="enterMatrix()"
        aria-label="Tomar la píldora roja y entrar al portafolio"
        title="Entrar al portafolio"
      ></button>
      <button
        type="button"
        class="pill pill-blue"
        (click)="goSite()"
        aria-label="Tomar la píldora azul e ir al sitio principal"
        title="Ir al sitio principal"
      ></button>
    </div>
    @for (item of slides; track item; let i = $index) {
      <div class="slider-item" [class.active]="i === currentIndex()">
        <p>{{ item }}</p>
      </div>
    }
  </div>
</div>

<audio controls autoplay loop style="display: none;">
  <source src="assets/audio/ytmp3free.cc_the-matrix-score-suite-youtubemp3free.org.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>
