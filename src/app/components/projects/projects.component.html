<div class="container-fluid container-skills text-center py-5">
  <h2 class="mb-4 title-skills">Mis Proyectos</h2>

  <div class="row g-4 skills-list">
    @for (card of cards; track card.title) {
      <app-skill-card
        class="col-12 col-md-4"
        [icon]="card.icon"
        [iconTone]="card.iconTone"
        [title]="card.title"
        [body]="card.body"
        [link]="card.link" />
    }
  </div>
</div>
