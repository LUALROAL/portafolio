@if (!showContent() && !showVideo()) {
  <app-matrix-background class="fade-in"></app-matrix-background>
}

<!-- Video de introducción (se muestra solo después de presionar el botón) -->
@if (showVideo()) {
  <div class="video-container fade-in">
    <video autoplay muted playsinline (ended)="showVideo.set(false); showContent.set(true)">
      <source src="assets/audio/matrix.mp4" type="video/mp4">
      Tu navegador no soporta el video.
    </video>
  </div>
}

@if (showContent()) {
  <div class="fade-in">
    <app-header id="header"></app-header>
    <app-about id="about"></app-about>
    <app-skills id="skills"></app-skills>
    <app-projects id="projects"></app-projects>
    <app-nav-menu></app-nav-menu>
  </div>
}

<router-outlet></router-outlet>
